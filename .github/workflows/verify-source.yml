name: Verify complete developer checkout
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - name: Verify editable masters and native rebuild inputs
        run: python3 tools/inputs.py verify
      - name: Check complete Git LFS objects
        run: git lfs fsck
