name: Import editable source into this repository
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: berbers-repository-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          lfs: true
      - name: Restore, hash-check and commit whole source files
        run: python3 tools/import_repository_inputs.py
